[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chokepoint"
version = "0.1.0"
description = "Attack-path agent for CI/CD pipelines — finds chains, computes min-cuts, verifies fixes"
requires-python = ">=3.10"
dependencies = [
    "falkordb>=1.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "ruamel.yaml>=0.18",
    "httpx>=0.27",
    "google-genai>=1.0",
    "fastmcp>=2.0",
    "gitpython>=3.1",
    "sse-starlette>=2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
chokepoint = "chokepoint.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
