name: "ChokePoint CI/CD Attack-Path Gate"
description: "Graph-based attack chain analysis, min-cut remediation, and PR gate for GitHub Actions"
author: "ChokePoint"

inputs:
  workflow_path:
    description: "Directory or workflow file to analyze"
    required: false
    default: ".github/workflows"
  fail_on_chains:
    description: "Fail the gate if attack paths to crown jewels are detected"
    required: false
    default: "true"
  sarif_file:
    description: "Output path for SARIF security report"
    required: false
    default: "chokepoint-results.sarif"

outputs:
  chains_count:
    description: "Number of attack chains found"
    value: ${{ steps.scan.outputs.chains_count }}
  min_cut_count:
    description: "Number of minimum fixes required to sever all chains"
    value: ${{ steps.scan.outputs.min_cut_count }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install ChokePoint Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install ruamel.yaml pydantic

    - name: Run ChokePoint Attack Path Scan
      id: scan
      shell: bash
      run: |
        export PYTHONPATH="$PYTHONPATH:${{ github.action_path }}/../backend/src"
        python -m chokepoint.cli scan "${{ inputs.workflow_path }}" --sarif -o "${{ inputs.sarif_file }}"
        python -m chokepoint.cli cut "${{ inputs.workflow_path }}" || true

    - name: Upload SARIF Report
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif_file }}
